name: CI / Release

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools pytest

      - name: Build sdist and wheel
        run: python -m build --sdist --wheel

      - name: Install package
        run: python -m pip install dist/*.whl

      - name: Run tests
        run: pytest -q

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install twine and build
        run: |
          python -m pip install --upgrade pip
          pip install twine build

      - name: Build distributions
        run: python -m build --sdist --wheel

      - name: Publish to TestPyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: python -m twine upload --repository-url https://test.pypi.org/legacy/ dist/*

      - name: Publish to PyPI
        if: ${{ secrets.PYPI_API_TOKEN != '' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/*

# Notes:
# - Add repository secrets:
#   - TEST_PYPI_API_TOKEN : TestPyPI API token (used for TestPyPI uploads)
#   - PYPI_API_TOKEN      : PyPI API token (used for PyPI uploads)
# - The publish job runs only for tags matching v*, e.g. `git tag v0.1.0 && git push --tags`